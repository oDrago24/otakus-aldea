<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Analiza tu aldea · Otakus Laborales</title>
<meta name="description" content="Pega los datos de tu aldea de Clash of Clans y descubre tu rush, tu progreso y qué mejorar primero.">
<link rel="icon" href="icono.png">
<style>
  :root { --bg: #f6f3fb; --card: #ffffff; --text: #1d1530; --muted: #6b6180; --accent: #6c3bb8; --gold: #e0a800;
          --border: #e2dbef; --ok: #1f8a4c; --err: #b3261e; }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #150e24; --card: #1f1633; --text: #efe9fb; --muted: #a99cc4; --accent: #a77bf0; --gold: #ffc629;
            --border: #34284d; --ok: #4cc782; --err: #ff8a80; }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text); font: 16px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  main { max-width: 720px; margin: 0 auto; padding: 24px 16px 48px; }
  header { display: flex; gap: 14px; align-items: center; margin-bottom: 20px; }
  header img { width: 56px; height: 56px; border-radius: 50%; }
  h1 { font-size: 1.4rem; margin: 0; }
  header p { margin: 2px 0 0; color: var(--muted); font-size: .95rem; }
  .card { background: var(--card); border: 1px solid var(--border); border-radius: 14px; padding: 18px; margin-bottom: 16px; }
  ol { margin: 0; padding-left: 20px; }
  li { margin: 4px 0; }
  b.path { color: var(--accent); }
  textarea:disabled { opacity: .5; }
  textarea { width: 100%; min-height: 150px; margin-top: 10px; padding: 12px; border-radius: 10px; border: 1px solid var(--border);
             background: var(--bg); color: var(--text); font: 13px/1.4 ui-monospace, Consolas, monospace; resize: vertical; }
  .row { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 12px; }
  button { flex: 1 1 140px; border: 0; border-radius: 10px; padding: 12px 16px; font: 600 1rem system-ui, sans-serif; cursor: pointer;
           background: var(--accent); color: #fff; }
  button.secondary { background: transparent; color: var(--accent); border: 1px solid var(--accent); }
  button:disabled { opacity: .6; cursor: wait; }
  #status { margin-top: 10px; color: var(--muted); min-height: 1.5em; }
  #status.err { color: var(--err); }
  #result { white-space: normal; overflow-wrap: anywhere; }
  #result code { font-family: ui-monospace, Consolas, monospace; color: var(--gold); letter-spacing: -1px; }
  .hidden { display: none; }
  footer { color: var(--muted); font-size: .85rem; text-align: center; margin-top: 24px; }
</style>
</head>
<body>
<main>
  <header>
    <img src="icono.png" alt="">
    <div>
      <h1>Analiza tu aldea</h1>
      <p>Otakus Laborales · rush, progreso y qué mejorar primero</p>
    </div>
  </header>

  <section class="card">
    <ol>
      <li>En Clash of Clans abre <b class="path">Ajustes → Más ajustes</b>.</li>
      <li>Toca <b class="path">Exportar datos de la aldea</b> y luego <b class="path">Copiar</b>.</li>
      <li>Vuelve aquí, pega el texto y pulsa <b>Analizar</b>.</li>
    </ol>
    <textarea id="json" placeholder='Pega aquí el texto que copió el juego (empieza con {"tag":...)' spellcheck="false"></textarea>
    <div class="row">
      <button id="paste" class="secondary" type="button">📋 Pegar</button>
      <button id="go" type="button">🔍 Analizar</button>
    </div>
    <div id="status" role="status"></div>
  </section>

  <section id="out" class="card hidden">
    <div id="result"></div>
    <div class="row">
      <button id="copy" type="button">📤 Copiar para Discord</button>
    </div>
  </section>

  <footer>Tu aldea no se guarda: solo se analiza. Datos del juego: ClashKing.</footer>
</main>
<script>
  const API = "https://yxfgxgndropdcmejqhan.supabase.co/functions/v1/aldea";
  const $ = (id) => document.getElementById(id);
  // Enlace personal que da /aldea en el Discord del clan (caduca en 30 min). Sin él la página no analiza nada.
  const token = new URLSearchParams(location.search).get("t");
  let markdown = "";

  const status = (text, err = false) => { $("status").textContent = text; $("status").className = err ? "err" : ""; };
  if (!token) {
    ["json", "paste", "go"].forEach((id) => { $(id).disabled = true; });
    status("🔒 Esta página es solo para el clan Otakus Laborales. Abre tu enlace personal con /aldea en nuestro Discord.", true);
  }
  const esc = (s) => s.replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
  // Markdown mínimo de Discord: `código`, **negrita**, _cursiva_ y saltos de línea.
  const render = (md) => esc(md)
    .replace(/`([^`]+)`/g, "<code>$1</code>")
    .replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>")
    .replace(/(^|\s)_([^_]+)_(?=\s|$)/g, "$1<em>$2</em>")
    .replace(/\n/g, "<br>");

  $("paste").onclick = async () => {
    try { $("json").value = await navigator.clipboard.readText(); status("Texto pegado. Pulsa Analizar."); }
    catch { status("Tu navegador no deja pegar con el botón: mantén pulsado el cuadro y elige Pegar.", true); }
  };

  $("go").onclick = async () => {
    const text = $("json").value.trim();
    if (!text) return status("Primero pega el texto que copió el juego.", true);
    $("go").disabled = true; status("Analizando…");
    try {
      const r = await fetch(`${API}?t=${encodeURIComponent(token)}`, { method: "POST", headers: { "content-type": "text/plain" }, body: text });
      const data = await r.json();
      if (!r.ok) throw new Error(data.error || "No se pudo analizar.");
      markdown = data.report;
      $("result").innerHTML = render(markdown);
      $("out").classList.remove("hidden");
      status("¡Listo!");
      $("out").scrollIntoView({ behavior: "smooth" });
    } catch (e) {
      status(e.message || "No se pudo conectar. Inténtalo de nuevo.", true);
    } finally { $("go").disabled = false; }
  };

  $("copy").onclick = async () => {
    try { await navigator.clipboard.writeText(markdown); status("Copiado: pégalo en Discord."); }
    catch { status("No se pudo copiar automáticamente; selecciona el texto y cópialo.", true); }
  };
</script>
</body>
</html>
